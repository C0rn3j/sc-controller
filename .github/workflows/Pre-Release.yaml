name: Create Pre-Release

on:
  push:
  pull_request:

jobs:
  build-linux:
    uses: ./.github/workflows/Linux.yaml

  build-windows:
    uses: ./.github/workflows/Windows.yaml

  build-macos:
    uses: ./.github/workflows/macOS.yaml

  get-info:
    runs-on: ubuntu-26.04
    outputs:
      date: ${{ steps.vars.outputs.date }}
      shorthash: ${{ steps.vars.outputs.shorthash }}
      fullhash: ${{ steps.vars.outputs.fullhash }}
    steps:
      - uses: actions/checkout@v7
      - name: Get date and git hash
        id: vars
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "fullhash=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "fullhash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  pre-release:
    if: github.ref == 'refs/heads/main' && github.repository == 'C0rn3j/sc-controller' && github.event_name == 'push'
    needs: [get-info, build-linux, build-windows, build-macos]
    runs-on: ubuntu-26.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ~/artifacts

      - name: Get latest release information
        id: get_latest_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api_url="https://api.github.com/repos/${{ github.repository }}"
          latest_release_info=$(curl -H "Authorization: token $GITHUB_TOKEN" "$api_url/releases/latest")
          echo "last_release_tag=$(echo "$latest_release_info" | jq -r '.tag_name')" >> $GITHUB_ENV

      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Process template release_body.md
        run: |
          sed -i 's|RELEASE_TAG|Pre-release-SC-Controller-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}|g' ${{ github.workspace }}/.github/release_body.md


      - name: Create Pre-Release on GitHub
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "Pre-release-SC-Controller-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}"
          tag: "Pre-release-SC-Controller-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}"
          draft: false
          prerelease: true
          # Pin to prevent a potential race with multiple commits at the same time
          commit: ${{ needs.get-info.outputs.fullhash }}
          #body: "Full Changelog: [${{ env.last_release_tag }}...${{ needs.get-info.outputs.shorthash }}](https://github.com/Taiko2k/Tauon/compare/${{ env.last_release_tag }}...${{ needs.get-info.outputs.fullhash }})"
          bodyFile: ${{ github.workspace }}/.github/release_body.md
          artifactErrorsFailBuild: true
          artifacts: |-
            ~/artifacts/*/*.7z
            ~/artifacts/*/*.dmg

          #  ~/artifacts/*/*.exe

#      - name: Publish to Release Repository
#        env:
#          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#        run: |
