name: Build Windows version

on:
  push:
  pull_request:

jobs:
  build-windows-x64:
    name: "Windows x64"
    runs-on: windows-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup pip cache-key
        uses: actions/cache@v6
        if: startsWith(runner.os, 'Windows')
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Read Package List
        id: read_packages
        run: |
          $packages = Get-Content packaging/windows_x64_clang.txt -Raw | Out-String
          $packages = $packages -replace "`r`n", " " -replace "`n", " "
          $packages = $packages.Trim() + " p7zip"
          echo "packages=$packages" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Set up MSYS2 MinGW-W64
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          update: true
          install: ${{ env.packages }}

      - name: Update CA trust
        shell: msys2 {0}
        run: update-ca-trust

      - name: Install Python dependencies and setup venv
        shell: msys2 {0}
        run: |
          python -m pip install --break-system-packages --upgrade pip
          python -m venv .venv
          export CFLAGS="-I/clang64/include"
          .venv/bin/python -m pip install \
            ".[all]" \
            build \
            pyinstaller \
            pytest
        #    https://github.com/pyinstaller/pyinstaller/archive/develop.zip

      - name: Read git-derived project version
        shell: msys2 {0}
        id: version
        run: |
          .venv/bin/python - <<'PY'
          import os
          from importlib.metadata import version as package_version
          # The preceding installation uses setuptools-scm to derive this from Git tags.
          version = package_version("sccontroller")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
            fh.write(f"version={version}\n")
          print(f"Detected version: {version}")
          PY

      - name: Build the project using python-build
        shell: msys2 {0}
        run: |
          source .venv/bin/activate
          python -m build --wheel

      - name: Install the project into a venv
        shell: msys2 {0}
        run: |
          source .venv/bin/activate
          pip install --prefix ".venv" dist/*.whl

      # - name: "[DEBUG] Try running using run.sh"
      #   run: bash run.sh

      - name: Run tests using pytest
        shell: msys2 {0}
        run: |
          PYTHONPATH=. pytest tests

      - name: "[DEBUG] List all files"
        run: find .

      - name: Build Windows app with PyInstaller
        run: |
          pyinstaller --log-level=DEBUG packaging/pyinstaller/windows.spec
        #  source .venv/bin/activate

      - name: "[DEBUG] List all files in .app"
        run: find "dist/SCC.app"

      - name: Create EXE
        run: |
          false

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: SCC-dmg
          path: dist/dmg/SCC.dmg

      - name: Run SCC for testing
        run: |
          false - will this even work

  build-windows-arm64:
    name: "Windows arm64"
    runs-on: windows-11-arm
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup pip cache-key
        uses: actions/cache@v6
        if: startsWith(runner.os, 'Windows')
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Read Package List
        id: read_packages
        run: |
          $packages = Get-Content packaging/windows_arm64_clang.txt -Raw | Out-String
          $packages = $packages -replace "`r`n", " " -replace "`n", " "
          $packages = $packages.Trim() + " p7zip"
          echo "packages=$packages" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Set up MSYS2 MinGW-W64
        uses: msys2/setup-msys2@v2
        with:
          msystem: clangarm64
          update: true
          install: ${{ env.packages }}

      - name: Update CA trust
        shell: msys2 {0}
        run: update-ca-trust

      - name: Install Python dependencies and setup venv
        shell: msys2 {0}
        run: |
          python -m pip install --break-system-packages --upgrade pip
          python -m venv .venv
          export CFLAGS="-I/clangarm64/include"
          .venv/bin/python -m pip install \
            ".[all]" \
            build \
            pyinstaller
        #    https://github.com/pyinstaller/pyinstaller/archive/develop.zip

      - name: Fail cause we dont do much here yet
        run: |
          false
