name: Build AppImages

env:
  # pinned to 2026-11-26 snapshots
  ANYLINUX_URL: https://github.com/pkgforge-dev/Anylinux-AppImages/raw/caa2848cc06936e00429a73adbad944da049ffc1
  BASE_IMAGE: ghcr.io/pkgforge-dev/archlinux@sha256:22453b39680f9e84635a22733f0fbeeb06d7a5cc08a588d0d36506fca0b2e852

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with: # args are required for git-based version detection
          ref: ${{ github.ref }}
          fetch-depth: 20
          fetch-tags: true

      - name: Expose slug values
        uses: rlespinasse/github-slug-action@v5

      - name: Setup buildx for docker
        uses: docker/setup-buildx-action@v4

      - name: Compile and build AppImage in Docker using the repo Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: . # explicit path context is required for git-based version detection
          platforms: ${{ matrix.platform }}
          outputs: build
          build-args: |
            ANYLINUX_URL
            BASE_IMAGE
            OWNER=${{ env.GITHUB_REPOSITORY_OWNER_PART }}

      - name: Slugify platform
        uses: rlespinasse/slugify-value@v1
        id: platform-slug
        with:
          key: PLATFORM
          value: ${{ matrix.platform }}
          publish-env: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: appimage-${{ steps.platform-slug.outputs.slug-url }}
          path: |
            build/*.AppImage
            build/*.AppImage.zsync
          if-no-files-found: error

  test:
    runs-on: ${{ matrix.runner }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Slugify platform
        uses: rlespinasse/slugify-value@v1
        id: platform-slug
        with:
          key: PLATFORM
          value: ${{ matrix.platform }}
          publish-env: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: appimage-${{ steps.platform-slug.outputs.slug-url }}
          path: assets
          merge-multiple: true

      - name: Test AppImage on Alpine
        uses: addnab/docker-run-action@v3
        with:
          image: alpine
          options: -v ${{ github.workspace }}/assets:/appimage
          run: |
            apk add coreutils
            find /appimage/ -type f -name '*.AppImage' | while read -r appimage; do
              chmod +x "${appimage}"
              ln -s "${appimage}" scc
              ./scc dependency-check || exit 1
              timeout 5 ./scc daemon --alone --foreground start
              rc="$?"
              if [ "$rc" -ne 124 ]; then
                echo >&2 "AppImage returned unexpected code $rc."
                if [ "$rc" -ne 0 ]; then exit "$rc"; else exit 1; fi
              fi
            done
