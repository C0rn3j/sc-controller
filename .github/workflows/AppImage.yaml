name: Build and publish AppImages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 20

      - name: Expose slug values
        uses: rlespinasse/github-slug-action@v5

      - name: Setup buildx for docker
        uses: docker/setup-buildx-action@v4

      - name: Compile and build AppImage in Docker using the repo Dockerfile
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          outputs: build
          build-args: |
            OWNER=${{ env.GITHUB_REPOSITORY_OWNER_PART }}

      - name: Slugify platform
        uses: rlespinasse/slugify-value@v1
        id: platform-slug
        with:
          key: PLATFORM
          value: ${{ matrix.platform }}
          publish-env: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: appimage-${{ steps.platform-slug.outputs.slug-url }}
          path: |
            build/*.AppImage
            build/*.AppImage.zsync
          if-no-files-found: error

  test:
    runs-on: ${{ matrix.runner }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Slugify platform
        uses: rlespinasse/slugify-value@v1
        id: platform-slug
        with:
          key: PLATFORM
          value: ${{ matrix.platform }}
          publish-env: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: appimage-${{ steps.platform-slug.outputs.slug-url }}
          path: appimages
          merge-multiple: true

      - name: Test AppImage on Alpine
        uses: addnab/docker-run-action@v3
        with:
          image: alpine
          options: -v ${{ github.workspace }}/assets:/appimage
          run: |
            apk add coreutils
            find /appimage/ -type f -name '*.AppImage' | while read -r appimage; do
              chmod +x "${appimage}"
              "${appimage}" dependency-check || exit 1
              timeout 5 "${appimage}" daemon --alone --foreground start
              rc="$?"
              if [ "$rc" -ne 124 ]; then
                echo >&2 "AppImage returned unexpected code $rc."
                if [ "$rc" -ne 0 ]; then exit "$rc"; else exit 1; fi
              fi
            done

  release:
    runs-on: ubuntu-latest

    needs:
      - build
      - test

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: appimage-*
          path: assets
          merge-multiple: true
      - name: Upload artifacts to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: assets/*
