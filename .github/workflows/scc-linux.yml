name: SCC Linux CI

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gir1.2-gtklayershell-0.1 \
            gir1.2-rsvg-2.0 \
            libcairo2-dev \
            libgirepository-2.0-dev \
            libgtk-3-dev \
            xvfb
          pip install . build installer pytest

      - name: Build SCC
        run: python -P -m build

      - name: Install SCC
        run: python -m pip install dist/*.whl

      - name: Run tests
        run: xvfb-run -a python -m pytest tests
