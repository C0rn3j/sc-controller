name: Build and release

on:
  push:
  pull_request:

jobs:
  build-linux-x64:
    name: "Pyinstaller Linux x64"
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: 'pip'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gettext \
            gobject-introspection \
            gir1.2-gtk-4.0 \
            gir1.2-rsvg-2.0 \
            gir1.2-notify-0.7 \
            gir1.2-girepository-3.0-dev \
            kde-config-gtk-style \
            libcairo2-dev \
            libgirepository1.0-dev \
            libgirepository-2.0-dev \
            libglib2.0-dev \
            libgtk-4-common \
            python3-gi-cairo \
            p7zip

      - name: Install Python dependencies and setup venv
        env:
          SDL_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          source .venv/bin/activate
          pip install \
            ".[all]" \
            build \
            pyinstaller \
            pytest
        #    https://github.com/pyinstaller/pyinstaller/archive/develop.zip

      - name: Read git-derived project version
        id: version
        run: |
          .venv/bin/python - <<'PY'
          import os
          from importlib.metadata import version as package_version
          # The preceding installation uses setuptools-scm to derive this from Git tags.
          version = package_version("sccontroller")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
            fh.write(f"version={version}\n")
          print(f"Detected version: {version}")
          PY

      - name: Build the project using python-build
        run: |
          source .venv/bin/activate
          python -m build --wheel

      - name: Install the project into a venv
        run: |
          source .venv/bin/activate
          pip install --prefix ".venv" dist/*.whl

      # - name: "[DEBUG] Try running using run.sh"
      #   run: bash run.sh

      - name: Run tests using pytest
        run: |
          source .venv/bin/activate
          PYTHONPATH=. pytest tests

      - name: "[DEBUG] List all files"
        run: find .

      - name: Build Linux App with PyInstaller
        run: |
          source .venv/bin/activate
          pyinstaller --log-level=DEBUG packaging/Linux.spec

      - name: "[DEBUG] List all files in packaged app"
        run: find "dist/sc-controller"

      - name: Create 7Z
        run: |
          APP_NAME="sc-controller"
          cd "dist/${APP_NAME}"

          ARCHIVE_PATH="../../${APP_NAME}-Linux-x64.7z"

          7z a -r -snl "${ARCHIVE_PATH}" "."

      - name: Upload 7Z artifact
        uses: actions/upload-artifact@v7
        with:
          name: sc-controller-Linux-x64
          path: sc-controller-Linux-x64.7z
          archive: false

      # - name: Run SCC for testing
      #   run: |
      #     source .venv/bin/activate
      #     sc-controller

  get-info:
    runs-on: ubuntu-26.04
    outputs:
      date: ${{ steps.vars.outputs.date }}
      shorthash: ${{ steps.vars.outputs.shorthash }}
      fullhash: ${{ steps.vars.outputs.fullhash }}
    steps:
      - uses: actions/checkout@v7
      - name: Get date and git hash
        id: vars
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "fullhash=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "fullhash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  pre-release:
    if: github.ref == 'refs/heads/main' && github.repository == 'C0rn3j/sc-controller' && github.event_name == 'push'
    needs: [get-info, build-linux-x64] # , build-linux-arm64, build-windows-x64, build-windows-arm64, build-macos-arm64
    runs-on: ubuntu-26.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ~/artifacts

      - name: Get latest release information
        id: get_latest_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api_url="https://api.github.com/repos/${{ github.repository }}"
          latest_release_info=$(curl -H "Authorization: token $GITHUB_TOKEN" "$api_url/releases/latest")
          echo "last_release_tag=$(echo "$latest_release_info" | jq -r '.tag_name')" >> $GITHUB_ENV

      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Process template release_body.md
        run: |
          sed -i 's|RELEASE_TAG|Pre-release-SC-Controller-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}|g' ${{ github.workspace }}/.github/release_body.md


      - name: Create Pre-Release on GitHub
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "Pre-release-SC-Controller-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}"
          tag: "Pre-release-SC-Controller-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}"
          draft: false
          prerelease: true
          #body: "Full Changelog: [${{ env.last_release_tag }}...${{ needs.get-info.outputs.shorthash }}](https://github.com/Taiko2k/Tauon/compare/${{ env.last_release_tag }}...${{ needs.get-info.outputs.fullhash }})"
          bodyFile: ${{ github.workspace }}/.github/release_body.md
          artifacts: |
            ~/artifacts/**/**/*.7z

          #  ~/artifacts/**/**/*.dmg
          #  ~/artifacts/**/**/*.exe

